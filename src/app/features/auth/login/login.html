<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Iniciar sesión</h1>

        @if (errorLogin()) {
          <div class="alert alert-danger py-2" role="alert">{{ errorLogin() }}</div>
        }

        <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input id="email" type="email" class="form-control" formControlName="email"
                   [class.is-invalid]="invalido('email')" placeholder="ana@mascotas.com">
            @if (formulario.controls.email.hasError('required')) {
              <div class="invalid-feedback">Escribe tu correo.</div>
            } @else {
              <div class="invalid-feedback">El correo no tiene un formato válido.</div>
            }
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" type="password" class="form-control" formControlName="password"
                   [class.is-invalid]="invalido('password')">
            <div class="invalid-feedback">Escribe tu contraseña.</div>
          </div>

          <button type="submit" class="btn btn-success w-100" [disabled]="enviando()">
            {{ enviando() ? 'Entrando…' : 'Entrar' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
